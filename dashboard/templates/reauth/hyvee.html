{% extends "base.html" %}

{% block page_header %}
  <h1>Reconnect Hy-Vee</h1>
  <p class="subtitle">A live view of the sign-in browser on the server. Tap the picture to click, use the box to type.</p>
{% endblock %}

{% block content %}
<section class="card">
  <p id="hv-msg" role="status">{{ status.message or 'Press Start to open the sign-in page.' }}</p>
  <div class="reauth-row">
    <button class="button" id="hv-start" type="button">Start</button>
    <button class="button" id="hv-fill" type="button">Fill saved login</button>
    <button class="button" id="hv-finish" type="button">I'm signed in</button>
    <button class="button" id="hv-stop" type="button">Stop</button>
  </div>
  <div id="hv-wrap" style="position:relative;max-width:100%;touch-action:manipulation">
    <img id="hv-shot" alt="Hy-Vee sign-in browser" style="width:100%;height:auto;border:1px solid #444;display:block;cursor:pointer">
  </div>
  <div class="reauth-row reauth-type">
    <input id="hv-text" type="text" autocomplete="off" autocapitalize="off" placeholder="Type here, then Send" class="reauth-input">
    <button class="button" id="hv-send" type="button">Send</button>
    <button class="button" id="hv-enter" type="button">Enter</button>
    <button class="button" id="hv-tab" type="button">Tab</button>
    <button class="button" id="hv-bksp" type="button">Backspace</button>
  </div>
</section>
<script>
(function () {
  var img = document.getElementById('hv-shot'), msg = document.getElementById('hv-msg');
  var VW = 900, VH = 760, running = false, finishing = false;
  function post(path, body) {
    return fetch('/reconnect/hyvee/' + path, {method: 'POST', body: new URLSearchParams(body || {})})
      .then(function (r) { return r.json(); })
      .then(function (s) { if (s.error) { msg.textContent = s.error; } else if (s.message) { msg.textContent = s.message; } running = !!s.active; return s; });
  }
  function refresh() {
    if (!running) return;
    img.src = '/reconnect/hyvee/shot.jpg?t=' + Date.now();
  }
  function poll() {
    fetch('/reconnect/hyvee/state').then(function (r) { return r.json(); }).then(function (s) {
      running = !!s.active;
      if (s.message) msg.textContent = s.message;
      if (s.active && s.url && s.url.indexOf('identity.hy-vee.com') === -1 && !finishing) {
        finishing = true;
        post('finish').then(function () { finishing = false; });
      }
    }).catch(function () {});
  }
  setInterval(refresh, 1200);
  setInterval(poll, 3000);
  img.addEventListener('click', function (e) {
    var r = img.getBoundingClientRect();
    post('click', {x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH}).then(refresh);
  });
  document.getElementById('hv-start').onclick = function () { post('start').then(function () { setTimeout(refresh, 2500); }); };
  document.getElementById('hv-fill').onclick = function () { msg.textContent = 'Filling...'; post('fill').then(refresh); };
  document.getElementById('hv-finish').onclick = function () { post('finish'); };
  document.getElementById('hv-stop').onclick = function () { post('stop').then(function () { location.href = '/reconnect'; }); };
  document.getElementById('hv-send').onclick = function () {
    var t = document.getElementById('hv-text'); post('type', {text: t.value}).then(refresh); t.value = '';
  };
  ['enter:Enter', 'tab:Tab', 'bksp:Backspace'].forEach(function (p) {
    var a = p.split(':'); document.getElementById('hv-' + a[0]).onclick = function () { post('key', {key: a[1]}).then(refresh); };
  });
  poll();
})();
</script>
{% endblock %}
