{% extends "base.html" %}

{% block page_header %}
  <h1>Orchestrator Health</h1>
  <p class="subtitle" id="generated-at">Loading…</p>
{% endblock %}

{% block content %}
  <div class="grid" id="grid">
    <section class="card" id="card-uptime">
      <h2>Uptime</h2>
      <div class="card-body">Loading…</div>
    </section>

    <section class="card" id="card-success">
      <h2>Task Success Rate</h2>
      <div class="card-body">Loading…</div>
    </section>

    <section class="card" id="card-watchdogs">
      <h2>Watchdog Health</h2>
      <div class="card-body">Loading…</div>
    </section>

    <section class="card" id="card-fallback">
      <h2>Telegram Fallback</h2>
      <div class="card-body">Loading…</div>
    </section>

    <section class="card card-wide" id="card-failures">
      <h2>Recent Failures</h2>
      <div class="card-body">Loading…</div>
    </section>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/dashboard.js"></script>
{% endblock %}
